<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="sky" cx="50%" cy="42%" r="70%">
      <stop offset="0" stop-color="#24345a"/>
      <stop offset="0.55" stop-color="#121a30"/>
      <stop offset="1" stop-color="#06080f"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe7a3"/>
      <stop offset="0.45" stop-color="#d9a441"/>
      <stop offset="1" stop-color="#7a5418"/>
    </linearGradient>
    <linearGradient id="stone" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4b5160"/>
      <stop offset="0.45" stop-color="#6f7688"/>
      <stop offset="1" stop-color="#2d313b"/>
    </linearGradient>
    <linearGradient id="stoneShade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.55"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#7fe8ff" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#3fb8ff" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#3fb8ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <clipPath id="disc"><circle cx="256" cy="256" r="228"/></clipPath>
  </defs>

  <!-- night sky disc -->
  <circle cx="256" cy="256" r="228" fill="url(#sky)"/>
  <g clip-path="url(#disc)">
    <g fill="#cfe6ff">
      <circle cx="120" cy="130" r="1.8" opacity="0.8"/>
      <circle cx="380" cy="110" r="2.2" opacity="0.9"/>
      <circle cx="410" cy="200" r="1.4" opacity="0.6"/>
      <circle cx="95" cy="230" r="1.4" opacity="0.6"/>
      <circle cx="170" cy="85" r="1.2" opacity="0.7"/>
      <circle cx="330" cy="70" r="1.3" opacity="0.6"/>
      <circle cx="440" cy="300" r="1.1" opacity="0.5"/>
    </g>
    <!-- hills -->
    <path d="M28 380 C 110 330, 180 350, 256 360 C 340 372, 400 330, 484 350 L 484 512 L 28 512 Z" fill="#0b1120"/>
    <path d="M28 410 C 120 380, 200 395, 256 398 C 330 402, 410 380, 484 400 L 484 512 L 28 512 Z" fill="#070b15"/>
    <!-- glow behind the stone -->
    <circle cx="256" cy="230" r="150" fill="url(#halo)"/>
    <!-- ground shadow -->
    <ellipse cx="256" cy="402" rx="110" ry="16" fill="#000" opacity="0.6" filter="url(#soft)"/>
    <!-- the waystone -->
    <path d="M196 404 L 184 196 C 182 160, 214 112, 256 104 C 300 112, 330 158, 328 196 L 318 404 Z" fill="url(#stone)"/>
    <path d="M196 404 L 184 196 C 182 160, 214 112, 256 104 C 300 112, 330 158, 328 196 L 318 404 Z" fill="url(#stoneShade)"/>
    <path d="M256 104 C 300 112, 330 158, 328 196 L 318 404 L 292 404 L 300 200 C 302 160, 284 124, 256 104 Z" fill="#000" opacity="0.22"/>
    <path d="M200 190 C 202 160, 226 126, 256 116" fill="none" stroke="#a9b0c2" stroke-width="3" opacity="0.45" stroke-linecap="round"/>
    <!-- carved rune: a compass star over a path -->
    <g filter="url(#glow)" stroke="#8ff0ff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M256 160 L 274 214 L 256 268 L 238 214 Z"/>
      <path d="M216 214 L 296 214"/>
      <path d="M256 268 L 256 300"/>
      <path d="M232 318 L 256 300 L 280 318"/>
      <path d="M232 350 L 256 332 L 280 350"/>
    </g>
    <circle cx="256" cy="214" r="6" fill="#e9fdff" filter="url(#glow)"/>
    <!-- motes -->
    <g fill="#9ff2ff" filter="url(#glow)">
      <circle cx="176" cy="250" r="3"/>
      <circle cx="342" cy="232" r="2.6"/>
      <circle cx="356" cy="300" r="2"/>
      <circle cx="160" cy="320" r="2"/>
      <circle cx="300" cy="140" r="2.2"/>
    </g>
  </g>

  <!-- gold ring with rivets -->
  <circle cx="256" cy="256" r="232" fill="none" stroke="#2a1d08" stroke-width="22"/>
  <circle cx="256" cy="256" r="232" fill="none" stroke="url(#gold)" stroke-width="16"/>
  <circle cx="256" cy="256" r="222" fill="none" stroke="#fff3c4" stroke-width="1.5" opacity="0.6"/>
  <circle cx="256" cy="256" r="241" fill="none" stroke="#3b2a0c" stroke-width="2"/>
  <g fill="url(#gold)" stroke="#3b2a0c" stroke-width="2">
    <path d="M256 6 L 270 26 L 256 46 L 242 26 Z"/>
    <path d="M256 466 L 270 486 L 256 506 L 242 486 Z"/>
    <path d="M6 256 L 26 242 L 46 256 L 26 270 Z"/>
    <path d="M466 256 L 486 242 L 506 256 L 486 270 Z"/>
  </g>
</svg>
